name: Fetch Claude Code Docs

on:
  schedule:
    # Every 2 days at 06:00 UTC. Day-of-month 1-31/2 is the closest cron can
    # get to a 48h cadence; month boundaries can stretch the gap to 2 days.
    # NOTE: no schedule run landed between 2026-10-15 and 2026-11-11. Short
    # probes are meaningless here: GitHub starts scheduled runs hours late
    # (github-stats: cron 00:05, runs 06:00-07:40), and upstream records that
    # late ticks of a multi-value cron line get merged into the next slot. The
    # 30-minute probes on 2026-11-19/20 therefore proved nothing. Test with a
    # single-value slot and a 24-hour window before concluding the scheduler is
    # dead; until then the archive is refreshed by workflow_dispatch too.
    - cron: "0 6 1-31/2 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install uv and Python 3.14t
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: "true"
          cache-python: "true"

      - name: Fetch all Anthropic docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run scripts/fetcher.py

      - name: Commit fetched docs
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working tree clean - nothing to commit."
            exit 0
          fi

          git config --global user.name "claude-yolo[bot]"
          git config --global user.email "claude-yolo@lroole.com"
          git add -A
          git commit -m "docs: refresh Anthropic documentation"
          git push origin HEAD:main

      - name: Alert on failure
        if: failure()
        env:
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
        run: |
          [ -n "${BARK_SERVER:-}" ] && [ -n "${BARK_DEVICES:-}" ] || exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra DEVICES <<< "$BARK_DEVICES"
          for dev in "${DEVICES[@]}"; do
            jq -n --arg k "$dev" --arg u "$RUN_URL" \
              '{device_key:$k, title:"🚨 docs pipeline failed", body:"needs human", url:$u, group:"Claude YOLO"}' \
            | curl -sS -X POST "$BARK_SERVER/push" -H 'Content-Type: application/json' -d @- || true
          done
