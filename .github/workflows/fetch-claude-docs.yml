name: Fetch Claude Code Docs

on:
  schedule:
    # Every 2 days at 05:17 UTC. Day-of-month 1-31/2 is the closest cron can
    # get to a 48h cadence; month boundaries can shorten the gap to 1 day.
    # Deliberately not on :00 - the top of the hour is the most delayed slot.
    # NOTE: schedule delivery went silent 2026-10-14..11-11 while the workflow
    # stayed state=active. GitHub schedules are best-effort: late ticks are
    # dropped and never backfilled, and short probes prove nothing. Recovery is
    # a write-access commit that changes the cron expression (GitHub documents
    # this as reactivating the workflow) plus PUT .../workflows/{id}/enable.
    - cron: "17 5 1-31/2 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Install uv and Python 3.14t
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14t"
          enable-cache: "true"
          cache-python: "true"

      - name: Fetch all Anthropic docs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run scripts/fetcher.py

      - name: Commit fetched docs
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Working tree clean - nothing to commit."
            exit 0
          fi

          git config --global user.name "claude-yolo[bot]"
          git config --global user.email "claude-yolo@lroole.com"
          git add -A
          git commit -m "docs: refresh Anthropic documentation"
          git push origin HEAD:main

      - name: Alert on failure
        if: failure()
        env:
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          BARK_DEVICES: ${{ secrets.BARK_DEVICES }}
        run: |
          [ -n "${BARK_SERVER:-}" ] && [ -n "${BARK_DEVICES:-}" ] || exit 0
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          IFS=',' read -ra DEVICES <<< "$BARK_DEVICES"
          for dev in "${DEVICES[@]}"; do
            jq -n --arg k "$dev" --arg u "$RUN_URL" \
              '{device_key:$k, title:"🚨 docs pipeline failed", body:"needs human", url:$u, group:"Claude YOLO"}' \
            | curl -sS -X POST "$BARK_SERVER/push" -H 'Content-Type: application/json' -d @- || true
          done
